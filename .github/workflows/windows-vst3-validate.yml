name: SONICRAFT v7.0 RC - Windows VST3 + Validator
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'installer/**'
      - 'runtime/**'
      - 'resource/**'
      - 'RC_*.bat'
      - '.github/workflows/windows-vst3-validate.yml'

jobs:
  build-validator:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Source gate
        shell: powershell
        run: python scripts/rc_source_gate_v70.py

      - name: Product Shell smoke from Windows path with spaces
        shell: powershell
        run: |
          $dst = Join-Path $env:RUNNER_TEMP 'SONICRAFT RC Space Path'
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          robocopy $PWD $dst /E /XD .git _deps build build-win64-v70 release logs | Out-Host
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
          & (Join-Path $dst 'installer\BUILD_PRODUCT_SHELL_V26.ps1') -ProjectRoot $dst
          if ($LASTEXITCODE -ne 0) { throw 'Product Shell path-with-spaces smoke failed' }

      - name: Full RC build stage
        shell: powershell
        run: ./installer/rc_v70/BUILD_RC_V70.ps1 -ProjectRoot $PWD

      - name: Upload exact validated VST3
        uses: actions/upload-artifact@v4
        with:
          name: SONICRAFT-AI-Strings-Q4-v7.0.0-rc2-VST3
          path: release/SONICRAFT AI Strings Q4.vst3

      - name: Upload build + Validator evidence
        uses: actions/upload-artifact@v4
        with:
          name: SONICRAFT-AI-Strings-Q4-v7.0.0-rc2-evidence
          path: |
            release/rc_evidence/build-provenance.json
            release/rc_evidence/validator-pass.json
            release/rc_evidence/steinberg_validator.log
            release/rc_evidence/windows_vst3_build.log
            release/rc_evidence/rc-build-stage.json
