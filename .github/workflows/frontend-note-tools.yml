name: Frontend note tools
on:
  push:
    paths: ['frontend/**', 'installer/COLLECT_PREBUILT_APP.ps1', 'installer/tools/verify_prebuilt_layout.py', '.github/workflows/frontend-note-tools.yml']
  pull_request:
    paths: ['frontend/**', 'installer/COLLECT_PREBUILT_APP.ps1', 'installer/tools/verify_prebuilt_layout.py', '.github/workflows/frontend-note-tools.yml']
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --test frontend/tests/note-tools.test.js
      - run: python runtime/frontend_layout_gate_v70.py
      - run: python runtime/smoke_frontend_packaging_v70.py
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Browser interactions
        run: |
          python frontend/editor_server.py --port 8765 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/api/status >/dev/null; then break; fi
            sleep 1
          done
          node frontend/tests/editor.browser.cjs
