name: Verify RC2 transfer prefix

on:
  push:
    branches:
      - release/v7.0-rc2-frontend-lock
    paths:
      - '.source_payload/VERIFY_PREFIX'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash current transfer prefix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts = sorted(Path('.source_payload').glob('full-*.b64'))
          encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
          print('PART_COUNT', len(parts))
          print('ENCODED_LEN', len(encoded))
          print('ENCODED_SHA256', hashlib.sha256(encoded.encode('ascii')).hexdigest())
          PY
