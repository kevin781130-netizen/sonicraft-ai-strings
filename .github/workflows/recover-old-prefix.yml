name: Recover old RC2 payload prefix

on:
  push:
    branches:
      - release/v7.0-rc2-frontend-lock
    paths:
      - '.source_payload/RECOVER_PREFIX'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover verified source prefix before first XZ corruption
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, lzma, io, tarfile, hashlib, json, shutil

          parts = sorted(Path('.source_payload').glob('full-*.b64'))
          encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
          packed = base64.b64decode(encoded, validate=True)
          print('PART_COUNT', len(parts))
          print('B64_CHARS', len(encoded))
          print('PACKED_BYTES', len(packed))
          print('PACKED_PREFIX_SHA256', hashlib.sha256(packed).hexdigest())

          # Feed small binary windows so a corrupt region does not discard the
          # decompressed bytes produced safely before it.
          dec = lzma.LZMADecompressor(format=lzma.FORMAT_XZ)
          raw_parts=[]
          bad_offset=None
          step=4096
          for off in range(0, len(packed), step):
              block=packed[off:off+step]
              try:
                  out=dec.decompress(block)
                  if out: raw_parts.append(out)
                  if dec.eof:
                      print('XZ_EOF_AT', off + len(block))
                      break
              except lzma.LZMAError as e:
                  bad_offset=off
                  print('XZ_CORRUPTION_WINDOW_START', off)
                  print('XZ_ERROR', repr(e))
                  break
          raw=b''.join(raw_parts)
          print('RECOVERED_TAR_PREFIX_BYTES', len(raw))

          outroot=Path('recovered_source_prefix')
          if outroot.exists(): shutil.rmtree(outroot)
          outroot.mkdir()
          complete=[]
          stop_reason=None
          try:
              tf=tarfile.open(fileobj=io.BytesIO(raw), mode='r:')
              while True:
                  try:
                      m=tf.next()
                  except (tarfile.ReadError, EOFError) as e:
                      stop_reason=f'{type(e).__name__}: {e}'
                      break
                  if m is None:
                      break
                  if not m.isfile():
                      continue
                  try:
                      f=tf.extractfile(m)
                      data=f.read() if f else b''
                  except Exception as e:
                      stop_reason=f'{type(e).__name__}: {e}'
                      break
                  if len(data) != m.size:
                      stop_reason=f'truncated member {m.name}: {len(data)}/{m.size}'
                      break
                  rel=m.name.lstrip('./')
                  # Guard against unsafe paths; diagnostic artifact only keeps
                  # normal relative files.
                  if not rel or rel.startswith('/') or '..' in Path(rel).parts:
                      continue
                  dst=outroot/rel
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  dst.write_bytes(data)
                  complete.append({'path':rel,'size':m.size,'sha256':hashlib.sha256(data).hexdigest()})
          except tarfile.ReadError as e:
              stop_reason=f'open: {e}'

          manifest={
            'part_count':len(parts),
            'b64_chars':len(encoded),
            'packed_bytes':len(packed),
            'packed_prefix_sha256':hashlib.sha256(packed).hexdigest(),
            'xz_corruption_window_start':bad_offset,
            'recovered_tar_prefix_bytes':len(raw),
            'complete_file_count':len(complete),
            'stop_reason':stop_reason,
            'files':complete,
          }
          Path('recovered_prefix_manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          print('COMPLETE_FILES', len(complete))
          print('TAR_STOP_REASON', stop_reason)
          if complete:
              print('FIRST_FILE', complete[0]['path'])
              print('LAST_FILE', complete[-1]['path'])
              for x in complete[-20:]: print('TAIL',x['path'],x['size'],x['sha256'])
          wanted=[
            'CMakeLists.txt','VERSION','src/processor.cpp','frontend/index.html',
            'runtime/frontend_layout_gate_v70.py',
            'standalone/win32/sonicraft_product_shell_win32_v26.cpp',
            'installer/inno/sonicraft_q4_rc_v70.iss','scripts/rc_source_gate_v70.py',
            'resource/SONICRAFT_AI_Strings_Q4.uidesc','release/SOURCE_FREEZE_v7.0.json']
          names={x['path'] for x in complete}
          for w in wanted: print('CRITICAL',w,'YES' if w in names else 'NO')
          PY

      - name: Upload recovered diagnostic source prefix
        uses: actions/upload-artifact@v4
        with:
          name: recovered-rc2-source-prefix
          path: |
            recovered_source_prefix/
            recovered_prefix_manifest.json
          if-no-files-found: error
          retention-days: 1
