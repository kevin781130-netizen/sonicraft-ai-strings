name: SONICRAFT v7.0 RC - Gap Closure Truth Gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - release/v7.0-rc2-commercial-hardening
      - release/v7.0-rc2-gap-closure

permissions:
  contents: read

jobs:
  gap-closure-truth-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile modified release gates
        run: >-
          python -m py_compile
          scripts/special_technique_gate_v70.py
          runtime/release_gate_v70.py
          training/blind_acoustic_release_v70.py
          training/special_technique_dataset_gate_v70.py
          training/final_model_manifest_gate_v70.py

      - name: Validate special-technique truth boundary
        run: python scripts/special_technique_gate_v70.py

      - name: Validate machine-readable status JSON
        run: python -m json.tool release/special_technique_status_v7.0.json >/dev/null

      - name: Validate blind-acoustic protocol template
        run: >-
          python training/blind_acoustic_release_v70.py validate-protocol
          release/blind_acoustic_protocol_template_v7.0.json --allow-template

      - name: Validate special-technique dataset template
        run: >-
          python training/special_technique_dataset_gate_v70.py
          release/special_technique_dataset_manifest_template_v7.0.json --allow-template

      - name: Validate final-model manifest template
        run: >-
          python training/final_model_manifest_gate_v70.py
          release/release_model_manifest_template_v7.0.json --allow-template

      - name: Assert blind-acoustic final-gate contract
        shell: python
        run: |
          from pathlib import Path
          text = Path('runtime/release_gate_v70.py').read_text(encoding='utf-8')
          required = [
              "blind-acoustic-qa.json",
              "blind acoustic QA not PASS",
              "double_blind",
              "randomized",
              "negative_control",
              "protocol_sha256",
              "raw_results_sha256",
              "blind acoustic evidence belongs to a different VST3 hash",
              "blind acoustic evidence belongs to a different model manifest hash",
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit('blind acoustic final-gate contract missing: ' + ', '.join(missing))
          doc = Path('release/BLIND_ACOUSTIC_GATE_v7.0.md')
          if not doc.is_file():
              raise SystemExit('missing blind acoustic release contract')
          print('blind acoustic final-gate contract: PASS')

      - name: Assert final-model provenance entrypoints
        shell: python
        run: |
          from pathlib import Path
          for rel in ('FINAL_GATE_V70.bat', 'PUBLIC_RELEASE_GATE_V70.bat'):
              text = Path(rel).read_text(encoding='utf-8', errors='ignore')
              if 'FINAL_MODEL_GATE_V70.bat' not in text:
                  raise SystemExit(f'{rel} does not require FINAL_MODEL_GATE_V70.bat')
          print('final-model provenance entrypoints: PASS')

      - name: Summary
        run: |
          echo 'Gap-closure truth gates are internally consistent.'
          echo 'Semantic special techniques remain non-acoustic until promoted.'
          echo 'Blind acoustic evidence can be generated only from a frozen protocol and hash-bound study artifacts.'
          echo 'Final/public release entrypoints require final-model provenance before binary approval.'
