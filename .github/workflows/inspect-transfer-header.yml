name: Inspect RC2 transfer header

on:
  push:
    branches:
      - release/v7.0-rc2-frontend-lock
    paths:
      - '.source_payload/INSPECT_HEADER'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact transfer header
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          from pathlib import Path
          import base64
          parts = sorted(Path('.source_payload').glob('full-*.b64'))
          encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
          raw = base64.b64decode(encoded, validate=True)
          Path('/tmp/partial.xz').write_bytes(raw)
          print('PART_COUNT', len(parts))
          print('ENCODED_LEN', len(encoded))
          print('XZ_FIRST_128_B64', base64.b64encode(raw[:128]).decode('ascii'))
          PY
          set +e
          xz -dc /tmp/partial.xz > /tmp/partial.tar 2>/tmp/xz.err
          echo "XZ_RC=$?"
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('/tmp/partial.tar').read_bytes()
          print('TAR_FIRST_1024_B64', base64.b64encode(p[:1024]).decode('ascii'))
          PY
