name: DNNI Research Tooling CI

on:
  pull_request:
    paths:
      - "training/dnni_reference.py"
      - "runtime/dnni_model_shell.py"
      - "runtime/build_dnni_vst_catalog.py"
      - "runtime/dnni_architecture_probe.py"
      - "PREPARE_DNNI_GOLDEN_PATH.bat"
      - "training/tests/dnni_dtype_map_smoke.py"
      - "runtime/dnni_golden_path_probe.py"
      - "runtime/dnni_dtype_map_probe.py"
      - "training/configs/dnni_observed_dtype_map.json"
      - "training/configs/dnni_observed_shared_regions.json"
      - "PROBE_DNNI_SHARED_REGIONS.bat"
      - "training/tests/dnni_shared_region_smoke.py"
      - "runtime/dnni_shared_region_probe.py"
      - "runtime/dnni_tensor_shape_probe.py"
      - "runtime/dnni_graph_fragment_probe.py"
      - "runtime/dnni_projection_bank_probe.py"
      - "runtime/dnni_operation_semantics_probe.py"
      - "runtime/dnni_recurrent_signature_probe.py"
      - "runtime/dnni_recurrent_hypothesis_probe.py"
      - "training/tests/dnni_recurrent_hypothesis_smoke.py"
      - "training/configs/dnni_observed_recurrent_hypothesis.json"
      - "PROBE_DNNI_RECURRENT_HYPOTHESIS.bat"
      - "training/tests/dnni_recurrent_signature_smoke.py"
      - "training/configs/dnni_observed_recurrent_signature.json"
      - "PROBE_DNNI_RECURRENT_SIGNATURE.bat"
      - "training/tests/dnni_operation_semantics_smoke.py"
      - "training/configs/dnni_observed_operation_constraints.json"
      - "PROBE_DNNI_OPERATION_SEMANTICS.bat"
      - "training/tests/dnni_projection_bank_smoke.py"
      - "training/configs/dnni_observed_projection_bank.json"
      - "training/tests/dnni_graph_fragment_smoke.py"
      - "training/configs/dnni_observed_graph_fragment.json"
      - "training/tests/dnni_tensor_shape_smoke.py"
      - "training/configs/dnni_observed_tensor_map.json"
      - "PROBE_DNNI_TENSOR_SHAPES.bat"
      - "training/tests/dnni_architecture_probe_smoke.py"
      - "src/dnni_runtime_layout.h"
      - "standalone/dnni_runtime_layout_smoke_v71.cpp"
      - "docs/DNNI_ARCHITECTURE_RECON_V71.md"
      - "PROBE_DNNI_ARCHITECTURE.bat"
      - "src/orchestra_instruments.h"
      - "src/orchestra_engine_contract.h"
      - "src/dnni_model_manifest.h"
      - "standalone/orchestra_engine_contract_smoke_v71.cpp"
      - "standalone/dnni_manifest_smoke_v71.cpp"
      - "BUILD_DNNI_VST_CATALOG.bat"
      - "docs/ORCHESTRA_ENGINE_V71.md"
      - "frontend/editor_server.py"
      - "training/tests/dnni_model_shell_smoke.py"
      - "DNNI_MODEL_SHELL.bat"
      - "training/configs/dnni_source_labels.json"
      - "training/train_codec.py"
      - "training/train_ballad_renderer.py"
      - "training/models/ballad_flow_renderer.py"
      - "runtime/models/ballad_flow_renderer.py"
      - "training/distill_renderer.py"
      - "training/shortcut_distill_renderer.py"
      - "training/scripts/import_dnni_four_timbres.py"
      - "training/scripts/import_dnni_input_dir.py"
      - "IMPORT_DNNI_5090.bat"
      - "training/scripts/generate_dnni_capture_plan.py"
      - "training/scripts/build_dnni_render_manifest.py"
      - "training/scripts/run_dnni_research_entry.py"
      - "training/scripts/dnni_training_status.py"
      - "training/scripts/dnni_5090_preflight.py"
      - "training/scripts/run_logged.py"
      - "scripts/TRAIN_DNNI_FOUR_TIMBRES_5090_RESEARCH.bat"
      - "TRAIN_DNNI_5090.bat"
      - "STOP_DNNI_5090.bat"
      - "STATUS_DNNI_5090.bat"
      - "SETUP_DNNI_5090.bat"
      - "DNNI_5090_MANAGER.bat"
      - "training/configs/dnni_four_timbres.json"
      - "training/scripts/dnni_pipeline_fingerprint.py"
      - "training/scripts/archive_dnni_training_state.py"
      - "RESET_DNNI_5090.bat"
      - "training/scripts/generate_dnni_batch_capture_midi.py"
      - "training/scripts/slice_dnni_batch_bounces.py"
      - "PREPARE_DNNI_CAPTURE.bat"
      - "SLICE_DNNI_BOUNCES.bat"
      - "training/tests/dnni_batch_capture_smoke.py"
      - "training/configs/dnni_5090_training.json"
      - "training/scripts/dnni_training_config.py"
      - "training/scripts/dnni_failure_diagnose.py"
      - "RESET_DNNI_STAGE.bat"
      - "training/scripts/dnni_training_finalize.py"
      - "VERIFY_DNNI_RESULT.bat"
      - "training/scripts/generate_dnni_identification_probe.py"
      - "training/scripts/identify_dnni_instruments.py"
      - "training/tests/dnni_identification_smoke.py"
      - "IDENTIFY_DNNI_TIMBRES.bat"
      - ".github/workflows/dnni-research-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tooling:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight capture-test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check mido numpy soundfile
      - name: Compile changed Python tools
        shell: pwsh
        run: |
          $files = @(
            "training/dnni_reference.py",
            "runtime/dnni_model_shell.py",
            "runtime/build_dnni_vst_catalog.py",
            "runtime/dnni_architecture_probe.py",
            "runtime/dnni_dtype_map_probe.py",
            "runtime/dnni_shared_region_probe.py",
            "runtime/dnni_tensor_shape_probe.py",
            "runtime/dnni_graph_fragment_probe.py",
            "runtime/dnni_projection_bank_probe.py",
            "runtime/dnni_operation_semantics_probe.py",
            "runtime/dnni_recurrent_signature_probe.py",
            "runtime/dnni_recurrent_hypothesis_probe.py",
            "training/tests/dnni_recurrent_hypothesis_smoke.py",
            "training/tests/dnni_recurrent_signature_smoke.py",
            "training/tests/dnni_operation_semantics_smoke.py",
            "training/tests/dnni_projection_bank_smoke.py",
            "training/tests/dnni_graph_fragment_smoke.py",
            "training/tests/dnni_tensor_shape_smoke.py",
            "training/tests/dnni_shared_region_smoke.py",
            "runtime/dnni_golden_path_probe.py",
            "training/tests/dnni_dtype_map_smoke.py",
            "training/tests/dnni_architecture_probe_smoke.py",
            "frontend/editor_server.py",
            "training/tests/dnni_model_shell_smoke.py",
            "training/train_codec.py",
            "training/train_ballad_renderer.py",
            "training/models/ballad_flow_renderer.py",
            "runtime/models/ballad_flow_renderer.py",
            "training/distill_renderer.py",
            "training/shortcut_distill_renderer.py",
            "training/scripts/import_dnni_four_timbres.py",
            "training/scripts/import_dnni_input_dir.py",
            "training/scripts/generate_dnni_capture_plan.py",
            "training/scripts/build_dnni_render_manifest.py",
            "training/scripts/run_dnni_research_entry.py",
            "training/scripts/dnni_training_status.py",
            "training/scripts/dnni_5090_preflight.py",
            "training/scripts/dnni_pipeline_fingerprint.py",
            "training/scripts/archive_dnni_training_state.py",
            "training/scripts/generate_dnni_batch_capture_midi.py",
            "training/scripts/slice_dnni_batch_bounces.py",
            "training/scripts/dnni_training_config.py",
            "training/scripts/dnni_failure_diagnose.py",
            "training/scripts/dnni_training_finalize.py",
            "training/scripts/generate_dnni_identification_probe.py",
            "training/scripts/identify_dnni_instruments.py",
            "training/tests/dnni_identification_smoke.py",
            "training/scripts/run_logged.py"
          )
          foreach ($f in $files) { python -m py_compile $f; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Smoke DNNI recurrent hypothesis
        shell: pwsh
        run: |
          python training/tests/dnni_recurrent_hypothesis_smoke.py
      - name: Smoke DNNI recurrent signature
        shell: pwsh
        run: |
          python training/tests/dnni_recurrent_signature_smoke.py
      - name: Smoke DNNI operation semantics
        shell: pwsh
        run: |
          python training/tests/dnni_operation_semantics_smoke.py
      - name: Smoke DNNI projection bank
        shell: pwsh
        run: |
          python training/tests/dnni_projection_bank_smoke.py
      - name: Smoke DNNI graph fragment
        shell: pwsh
        run: |
          python training/tests/dnni_graph_fragment_smoke.py
      - name: Smoke DNNI tensor shape
        shell: pwsh
        run: |
          python training/tests/dnni_tensor_shape_smoke.py
      - name: Smoke DNNI shared regions
        shell: pwsh
        run: |
          python training/tests/dnni_shared_region_smoke.py
      - name: Smoke DNNI dtype map
        shell: pwsh
        run: |
          python training/tests/dnni_dtype_map_smoke.py
      - name: Smoke DNNI architecture probe
        shell: pwsh
        run: |
          python training/tests/dnni_architecture_probe_smoke.py
      - name: Smoke DNNI model shell
        shell: pwsh
        run: |
          python training/tests/dnni_model_shell_smoke.py
      - name: Generate deterministic capture plan
        shell: pwsh
        run: |
          python training/scripts/generate_dnni_capture_plan.py --out "$env:RUNNER_TEMP/capture_plan.jsonl"
          $count = (Get-Content "$env:RUNNER_TEMP/capture_plan.jsonl").Count
          if ($count -ne 64) { throw "Expected 64 default timbre-only capture rows, got $count" }
          python -c "import json,sys; rows=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip()]; assert all(r.get('articulation_verified') is False for r in rows), 'DNNI capture articulation must default to unverified'" "$env:RUNNER_TEMP/capture_plan.jsonl"
      - name: Validate four-timbre config and presets
        shell: pwsh
        run: |
          python -c "import json; c=json.load(open('training/configs/dnni_four_timbres.json',encoding='utf-8')); s=sorted(c['slots'],key=lambda x:x['slot']); assert [x['slot'] for x in s]==[1,2,3,4]; assert sorted(x['instrument'] for x in s)==[0,1,2,3]; assert len({x['timbre_id'] for x in s})==4"
          python -c "import ast; t=ast.parse(open('training/train_ballad_renderer.py',encoding='utf-8').read()); p=next(ast.literal_eval(n.value) for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='PRESETS' for x in n.targets)); assert p['hq_dnni4']['instruments']==4; assert p['frontier_core_dnni4']['instruments']==4"
      - name: Smoke four-long-MIDI and four-long-WAV slicing
        shell: pwsh
        run: |
          python training/tests/dnni_batch_capture_smoke.py
      - name: Validate RTX 5090 recipe and resume hash semantics
        shell: pwsh
        run: |
          python training/scripts/dnni_training_config.py --write-cmd "$env:RUNNER_TEMP/dnni_recipe.cmd"
          python -c "import copy,sys; sys.path.insert(0,'training/scripts'); import dnni_training_config as d; c=d.load('training/configs/dnni_5090_training.json'); r=d.stage_fingerprint(c,'renderer'); q=d.stage_fingerprint(c,'codec'); c2=copy.deepcopy(c); c2['renderer']['epochs']+=10; assert d.stage_fingerprint(c2,'renderer')==r; c3=copy.deepcopy(c); c3['renderer']['batch']+=1; assert d.stage_fingerprint(c3,'renderer')!=r; assert d.stage_fingerprint(c3,'codec')==q"
      - name: Identify shuffled synthetic violin viola cello bass
        shell: pwsh
        run: |
          python training/tests/dnni_identification_smoke.py
      - name: Status helper clean-checkout smoke
        shell: pwsh
        run: |
          python training/scripts/dnni_training_status.py --json
      - name: Failure diagnosis smoke
        shell: pwsh
        run: |
          python training/scripts/dnni_failure_diagnose.py --logs "$env:RUNNER_TEMP/no_logs_here"
      - name: Logged runner propagates success
        shell: pwsh
        run: |
          python training/scripts/run_logged.py --log "$env:RUNNER_TEMP/tooling.log" -- python -c "print('dnni-ci-ok')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
