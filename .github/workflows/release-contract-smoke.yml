name: Release contract smoke

on:
  pull_request:
    paths:
      - 'training/**'
      - 'scripts/SELECT_TRAINING_PYTHON.bat'
      - 'scripts/SETUP_TRAINING.bat'
      - 'TRAIN_RENDERER_GPU.bat'
      - 'TRAIN_PERFORMANCE_PLANNER.bat'
      - 'TRAINING_CONTROL_PANEL.bat'
      - 'PAUSE_TRAINING.bat'
      - 'RESUME_TRAINING.bat'
      - 'docs/TRAINING_PAUSE_RESUME.md'
      - 'docs/PERFORMANCE_PLANNER.md'
      - 'docs/SCHEMA8_TRANSITION_RELEASE.md'
      - 'docs/SCHEMA8_PRODUCTION_RUNBOOK.md'
      - 'docs/CLEANROOM_TEACHER_DISTILLATION.md'
      - '.github/workflows/release-contract-smoke.yml'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run release contract smoke
        run: python training/run_release_contract_smoke.py

      - name: Run training pause control smoke
        run: python training/smoke_training_control.py

  local-training-handoff:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check local training preflight and actual Windows launchers
        run: python training/smoke_local_training_handoff.py
