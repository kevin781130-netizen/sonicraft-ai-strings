name: Materialize SONICRAFT full source

on:
  push:
    branches:
      - release/v7.0-rc2-frontend-lock
    paths:
      - '.source_payload/READY_FULL'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify transfer archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .source_payload/READY_FULL
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          parts = sorted(Path('.source_payload').glob('full-*.b64'))
          if len(parts) != 66:
              raise SystemExit(f'expected 66 payload parts, got {len(parts)}')
          encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
          archive = base64.b64decode(encoded, validate=True)
          expected = '64ac9760d95459f80c949c1abc8224fe5aa9705dda6785de602e13774da7acb3'
          actual = hashlib.sha256(archive).hexdigest()
          print('archive sha256:', actual)
          if actual != expected:
              raise SystemExit(f'archive sha256 mismatch: {actual} != {expected}')
          Path('/tmp/sonicraft_full_source.tar.xz').write_bytes(archive)
          PY

      - name: Replace repository working tree with complete RC2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sonicraft_rc2_source
          mkdir -p /tmp/sonicraft_rc2_source
          tar -xJf /tmp/sonicraft_full_source.tar.xz -C /tmp/sonicraft_rc2_source
          rsync -a --delete --exclude='.git/' /tmp/sonicraft_rc2_source/ ./

      - name: Verify exact editable source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f CMakeLists.txt
          test -f VERSION
          test -d src
          test -d runtime
          test -d standalone
          test -d frontend
          test -d installer
          test -d scripts
          test -d training
          test -d docs
          test -d release
          test -d cubase
          test -d studio_one
          test -d recording_cues
          test -f src/processor.cpp
          test -f frontend/index.html
          test ! -e .source_payload
          test ! -e .github/workflows/materialize-full-source.yml
          test ! -e _probe_do_not_merge.txt
          count="$(find . -type f -not -path './.git/*' | wc -l)"
          echo "Materialized file count: $count"
          test "$count" -eq 1016

      - name: Commit full editable source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: materialize complete v7.0 RC2 editable source tree'
          git push origin HEAD:release/v7.0-rc2-frontend-lock
