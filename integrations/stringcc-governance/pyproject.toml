[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stringcc-governance-bridge"
version = "1.1.0"
description = "Clean-room StringCC governance and process-boundary bridge for SONICRAFT AI Strings"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
stringcc-governance = "stringcc_governance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stringcc_governance*"]
